[package]
name = "grnfr-host"
version = "0.3.1"
edition = "2021"
description = "GRNFR Host CMP : app native (pas de web) pour un serveur auto-hébergé (relais WebSocket, sans limite de joueurs) du mod GRNFR CMP, config stockée dans Supabase."

[[bin]]
name = "grnfr-host"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
eframe = "0.27"
egui = "0.27"

[profile.release]
opt-level = 2
