[package]
name = "grnfr-host"
version = "0.2.1"
edition = "2021"
description = "GRNFR Host CMP : serveur auto-hébergé (relais WebSocket, sans limite de joueurs) pour le mod GRNFR CMP."

[[bin]]
name = "grnfr-host"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
