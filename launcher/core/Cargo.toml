[package]
name = "grnfr-launcher-core"
version = "0.1.0"
edition = "2021"
description = "Cœur de GRNFR CMP Launcher, sans Tauri (testable partout avec cargo test) : relais local du mod vers Supabase, détection de BeamNG/BeamMP, lancement, installation du mod, réglages."

[dependencies]
tiny_http = "0.12"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
