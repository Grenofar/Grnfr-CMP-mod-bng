<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon compte — GRNFR CPM</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><b>GRNFR CPM</b><a href="/">Accueil</a><a href="/account.html">Mon compte</a><a href="/admin.html">Admin</a></header>
<main>
  <h1>Mon compte</h1>
  <p id="err" class="err"></p><p id="info" class="ok"></p>
  <section id="login" hidden>
    <div class="form">
      <input id="email" type="email" placeholder="E-mail" autocomplete="email">
      <input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
      <input id="name" type="text" maxlength="20" placeholder="Pseudo (inscription seulement)" hidden>
      <small id="hint" class="mut" hidden></small>
      <div class="row"><button class="btn" id="go">Connexion</button><button class="btn dim" id="swap">Créer un compte</button></div>
    </div>
  </section>
  <section id="app" hidden>
    <div class="row"><div class="card"><div class="mut">Joueur</div><div class="big" id="who"></div></div><div class="card"><div class="mut">Argent</div><div class="big" id="bal"></div></div><button class="btn dim" id="out">Déconnexion</button></div>
    <div class="tabs" id="tabs"></div>
    <div id="pane"></div>
  </section>
</main>
<script src="/config.js"></script><script src="/site.js"></script>
<script>
const $ = id => document.getElementById(id), esc = GRNFR.esc, money = GRNFR.money
let reg = false, me = null, tab = "garage", nameT = null
const err = e => { $("err").textContent = e ? GRNFR.msg(e) : ""; $("info").textContent = "" }
$("swap").onclick = () => { reg = !reg; $("name").hidden = $("hint").hidden = !reg; $("go").textContent = reg ? "Créer le compte" : "Connexion"; $("swap").textContent = reg ? "J'ai un compte" : "Créer un compte"; err() }
$("name").oninput = () => {
  const n = $("name").value, h = $("hint"); clearTimeout(nameT)
  if (!/^[A-Za-z0-9_]{3,20}$/.test(n)) { h.textContent = "3 à 20 lettres, chiffres ou _"; h.className = "mut"; return }
  nameT = setTimeout(async () => { try { const ok = await GRNFR.rpcPublic("username_available", { p_username: n }); h.textContent = ok ? "✓ pseudo libre" : "✗ pseudo déjà pris"; h.className = ok ? "good" : "bad" } catch (e) { /* ignoré */ } }, 350)
}
$("go").onclick = async () => {
  err()
  try {
    if (reg) { if (!(await GRNFR.signUp($("email").value, $("pw").value, $("name").value))) { $("info").textContent = "Compte créé. Confirmez votre e-mail puis connectez-vous."; return } }
    else await GRNFR.signIn($("email").value, $("pw").value)
    start()
  } catch (e) { err(e) }
}
$("out").onclick = () => { GRNFR.signOut(); location.reload() }
const TABS = { garage: "Garage", market: "Annonces", servers: "Serveurs", history: "Historique" }
$("tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}">${v}</button>`).join("")
$("tabs").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; show() } }
async function show() {
  [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.t === tab)); err()
  const p = $("pane"); p.innerHTML = "<p class='mut'>Chargement…</p>"
  try {
    if (tab === "garage") { me = await GRNFR.rpc("get_me"); p.innerHTML = me.vehicles.length ? me.vehicles.map(v => `<div class="card"><b>${esc(v.nickname || v.model_key)}</b> <span class="mut">place ${v.slot + 1} · ${esc(v.model_key)} · ${money(v.value)}${v.listed ? " · en annonce" : ""}</span></div>`).join("") : "<p class='mut'>Garage vide. Achetez un véhicule dans le jeu (touche O > Concession).</p>" }
    if (tab === "market") { const l = await GRNFR.rpc("get_market", { p_limit: 50, p_offset: 0 }); p.innerHTML = l.length ? l.map(x => `<div class="card row"><b>${esc(x.nickname || x.model_key)}</b><span class="mut">${esc(x.model_key)} · vendeur ${esc(x.seller)}</span><b>${money(x.price)}</b><button class="btn" data-buy="${x.id}">Acheter</button></div>`).join("") : "<p class='mut'>Aucune annonce.</p>" }
    if (tab === "servers") { const s = await GRNFR.rpc("get_servers"); p.innerHTML = s.map(x => `<div class="card"><b>${esc(x.name)}</b> — ${x.count}/${x.max_players}<div class="mut">Joueurs : ${x.players.length ? x.players.map(esc).join(", ") : "personne"}</div></div>`).join("") + "<p class='mut'>On rejoint un serveur depuis le jeu (touche O > Serveurs).</p>" }
    if (tab === "history") { const t = await GRNFR.rpc("get_my_transactions", { p_limit: 50 }); p.innerHTML = "<table>" + t.map(x => `<tr><td>${esc(x.created_at.slice(0, 16).replace("T", " "))}</td><td>${esc(x.ref || x.kind)}</td><td class="n ${x.amount < 0 ? "bad" : "good"}">${x.amount > 0 ? "+" : ""}${x.amount}</td></tr>`).join("") + "</table>" }
  } catch (e) { err(e); p.innerHTML = "" }
}
$("pane").onclick = async e => { const id = e.target.dataset.buy; if (!id) return; try { await GRNFR.rpc("buy_listing", { p_listing_id: id }); await refresh(); show(); $("info").textContent = "Achat effectué." } catch (x) { err(x) } }
async function refresh() { me = await GRNFR.rpc("get_me"); $("who").textContent = me.profile.username; $("bal").textContent = money(me.profile.balance) }
async function start() { $("login").hidden = true; $("app").hidden = false; try { await refresh(); show() } catch (e) { GRNFR.signOut(); $("app").hidden = true; $("login").hidden = false; err(e) } }
if (!GRNFR.configured) err({ message: "not_configured" }); else if (GRNFR.loggedIn) start(); else $("login").hidden = false
</script></body></html>
