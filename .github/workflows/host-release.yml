name: GRNFR Host CMP — build & release

# Compile host/ (app Tauri : Rust + React/TypeScript) sur de vraies machines Windows/Linux/macOS — aucun
# cargo/rustc/node n'est disponible dans l'environnement qui a écrit ce code (voir host/README.md).
# Déclenché par un tag "host-vX.Y.Z" : construit le frontend (Vite) puis empaquette l'app native avec
# tauri-action, qui publie les installeurs en pièces jointes d'une GitHub Release du même nom.
#
# Secrets requis (Settings > Secrets and variables > Actions, sur ce dépôt) :
# - SUPABASE_URL / SUPABASE_ANON_KEY — embarqués À LA COMPILATION dans le binaire (voir
#   host/src-tauri/src/supabase.rs). Sans eux, l'app compile quand même mais ne peut pas lire/écrire ses
#   serveurs dans Supabase.
# - TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD — pour signer les artefacts de mise à
#   jour (voir host/README.md, "Mises à jour signées"). Sans eux, l'app compile et tourne quand même, juste
#   sans fichiers .sig / latest.json : la mise à jour automatique ne trouve rien à proposer.
on:
  push:
    tags:
      - "host-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: host/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "host/src-tauri -> target"

      - name: Installe les dépendances du frontend
        working-directory: host
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: host
          tagName: ${{ github.ref_name }}
          releaseName: "GRNFR Host CMP ${{ github.ref_name }}"
          releaseBody: |
            Binaires de GRNFR Host CMP, compilés automatiquement par GitHub Actions (Windows, Linux, macOS).
            App native (Tauri — Rust + React/TypeScript) : au premier lancement, un assistant crée votre
            premier serveur (nom, mot de passe facultatif, port — 30814 par défaut). Plusieurs serveurs par
            installation, lançables en même temps. Mises à jour automatiques et signées. Voir host/README.md.
          releaseDraft: false
          prerelease: false
