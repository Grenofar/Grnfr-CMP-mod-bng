name: GRNFR Host CMP — build & release

# Compile host/ (app Tauri : Rust + React/TypeScript) sur de vraies machines Windows/Linux/macOS — aucun
# cargo/rustc/node n'est disponible dans l'environnement qui a écrit ce code (voir host/README.md).
# Déclenché par un tag "host-vX.Y.Z" : construit le frontend (Vite) puis empaquette l'app native avec
# tauri-action, qui publie les installeurs en pièces jointes d'une GitHub Release du même nom.
#
# Secrets requis (Settings > Secrets and variables > Actions, sur ce dépôt) :
# - SUPABASE_URL / SUPABASE_ANON_KEY — embarqués À LA COMPILATION dans le binaire (voir
#   host/src-tauri/src/supabase.rs). Sans eux, l'app compile quand même mais ne peut pas lire/écrire ses
#   serveurs dans Supabase.
# - TAURI_SIGNING_PRIVATE_KEY — pour signer les artefacts de mise à jour (voir host/README.md, "Mises à
#   jour signées"). Sans lui, l'app compile et tourne quand même, juste sans fichiers .sig / latest.json :
#   la mise à jour automatique ne trouve rien à proposer.
#   PAS de TAURI_SIGNING_PRIVATE_KEY_PASSWORD : la clé a été générée sans mot de passe, et GitHub ne peut pas
#   stocker un secret vide — passer quand même la variable (vide) à tauri-action fait planter la signature
#   NSIS/AppImage avec "incorrect updater private key password: Missing comment in secret key", alors que la
#   même clé se signe sans erreur côté dmg (bug connu : tauri-apps/tauri-action#658 et consorts). Ne pas
#   réintroduire cette variable tant que la clé n'a pas un vrai mot de passe.
on:
  push:
    tags:
      - "host-v*"
  # Déclenchement manuel (Actions > Run workflow) avec le numéro de version : crée lui-même le tag host-vX.Y.Z,
  # utile quand on ne peut pas pousser de tag. Sans numéro, github.ref_name vaudrait "main" et la release serait fausse.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, identique à host/src-tauri/tauri.conf.json (ex. 0.5.2)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('host-v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version du tag = version de l'app
        run: |
          want="${TAG#host-v}"
          have=$(node -p "require('./host/src-tauri/tauri.conf.json').version")
          echo "tag $TAG / app $have"
          [ "$want" = "$have" ] || { echo "::error::$TAG ne correspond pas à la version $have de tauri.conf.json"; exit 1; }

  publish:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: host/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "host/src-tauri -> target"

      - name: Installe les dépendances du frontend
        working-directory: host
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: host
          tagName: ${{ env.TAG }}
          releaseName: "GRNFR Host CMP ${{ env.TAG }}"
          releaseBody: |
            Binaires de GRNFR Host CMP, compilés automatiquement par GitHub Actions (Windows, Linux, macOS).
            App native (Tauri — Rust + React/TypeScript) : au premier lancement, un assistant crée votre
            premier serveur (nom, mot de passe facultatif, port — 30814 par défaut). Plusieurs serveurs par
            installation, lançables en même temps. Mises à jour automatiques et signées. Voir host/README.md.
          releaseDraft: false
          prerelease: false
